theme: jekyll-theme-primer
title: UCA Users Groups Open Source Initiative
description: Open-source projects and tooling for the CIM and IEC 61850 communities, sponsored by the UCA and its CIM and 61850 Users Groups.
tagline: Open source for the CIM and 61850 communities
lang: en-US

# Used by the landing page (_layouts/default.html, index.html)
contact_email: github.admin@cimug.org
github_org_url: https://github.com/cimug-org

# Link-preview (social) image for every page; jekyll-seo-tag emits og:image
# and the large X card from it. The same PNG is the repo's GitHub Social preview.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/social/ucaiug-social-1280x640.png
        width: 1280
        height: 640
        alt: UCA Users Groups Open Source Initiative, with the CIM and 61850 Users Group logos

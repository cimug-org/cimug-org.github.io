<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" href="{{ "/assets/img/brand/CIMug_mark.svg" | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">
{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <!-- Landing page for www.ucaiug.io, CIM Model Management brand (direction A).
         Branding: assets/css/style.scss. Content: index.html, _data/projects.yml, _data/news.yml. -->
    {{ content }}

    <footer class="uca-footer">
      <div class="uca-wrap uca-footer-inner">
        <img src="{{ "/assets/img/brand/CIM_Model_Management_logo_white.svg" | relative_url }}" alt="CIM Model Management" height="30">
        <div>Hosted on GitHub Pages · <a href="{{ site.github_org_url }}" target="_blank" rel="noopener">github.com/cimug-org</a> · <a href="mailto:{{ site.contact_email }}?subject=UCA-Open-Source-Initiatives">{{ site.contact_email }}</a></div>
      </div>
    </footer>

    <dialog class="uca-lightbox" id="uca-lightbox" aria-labelledby="uca-lb-title">
      <div class="uca-lb-inner">
        <button type="button" class="uca-lb-close" aria-label="Close">✕</button>
        <figure>
          <img id="uca-lb-img" alt="">
          <figcaption>
            <div class="uca-lb-cap"><b id="uca-lb-title"></b> <span id="uca-lb-caption"></span></div>
            <div class="uca-lb-links"><a id="uca-lb-site" href="#" target="_blank" rel="noopener">Website →</a><a id="uca-lb-repo" href="#" target="_blank" rel="noopener">Repository</a></div>
          </figcaption>
        </figure>
      </div>
    </dialog>
    <script src="{{ "/assets/js/lightbox.js" | relative_url }}"></script>
  </body>
</html>
